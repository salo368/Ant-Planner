<!DOCTYPE html>
<html lang="es">
<script>
    function toggleButton(selected) {
        const personalBtn = document.getElementById('personalBtn');
        const grupalBtn = document.getElementById('grupalBtn');

        if (selected === 'personal') {
            personalBtn.classList.add('active');
            grupalBtn.classList.remove('active');
        } else {
            grupalBtn.classList.add('active');
            personalBtn.classList.remove('active');
        }
    }
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>Ant Planner</title>
</head>

<body>
    <div class="nav-cont">
        <nav>
            <div class="nav-logo">
                <a>
                    <img src="antLogo.svg" alt="Dashboard" />
                </a>
            </div>
            <h6 class="menu-h6">Menu</h6>
            <ul>
                <li>
                    <i><img src="panel.svg" alt="Dashboard" /></i>
                    <a>Dashboard</a>
                </li>
                <li class="nav-selected">
                    <i><img src="board.svg" alt="Board" /></i>
                    <a>Tableros</a>
                </li>
                <li>
                    <i><img src="gestor.svg" alt="Gestor" /></i>
                    <a>Gestor</a>
                </li>
                <li>
                    <i><img src="calendar.svg" alt="Calendar" /></i>
                    <a>Calendario</a>
                </li>
                <li>
                    <i><img src="conf.svg" alt="Conf" /></i>
                    <a>Ajustes</a>
                </li>
            </ul>
        </nav>
    </div>
    <div class="main-cont">
        <div class="main-sub-cont">
            <header>
                <h1 id="main-little-title">Dashboard / Kanban</h1>
                <div class="switch-container">
                    <h1 id="main-title">Kanban</h1>

                    <div class="button-container">
                        <button id="personalBtn" class="toggle-button active left" onclick="toggleButton('personal')">
                            <img src="userKanban.svg" alt="Personal">
                        </button>
                        <button id="grupalBtn" class="toggle-button right" onclick="toggleButton('grupal')">
                            <img src="groupKanban.svg" alt="Personal">
                        </button>
                    </div>
                </div>
                <hr>
            </header>
            <main>
                <div class="widget-kanban">
                    <div id="kanban-todo" class="kanban-list">
                        <h2 class="kanban-title">Por Hacer</h2>
                        <div class="kanban-body">

                        </div>
                    </div>
                    <div id="kanban-pause" class="kanban-list">
                        <h2 class="kanban-title">En Pausa</h2>
                        <div class="kanban-body">

                        </div>
                    </div>
                    <div id="kanban-process" class="kanban-list">
                        <h2 class="kanban-title">En Proceso</h2>
                        <div class="kanban-body">

                        </div>
                    </div>
                    <div id="kanban-verify" class="kanban-list">
                        <h2 class="kanban-title">Por Verificar</h2>
                        <div class="kanban-body">

                        </div>
                    </div>
                    <div id="kanban-done" class="kanban-list">
                        <h2 class="kanban-title">Completado</h2>
                        <div class="kanban-body">

                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>

<script src="main.js"></script>

</html>
