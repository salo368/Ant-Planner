<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/svg+xml" href="icon.svg">
        <title>Ant Planner</title>
    </head>
    <body>
        <div class="nav-cont">
            <nav>
                <div class="nav-logo">
                    <a>
                        <img src="antLogo.svg" alt="Dashboard" />
                    </a>
                </div>
                <h6 class="menu-h6">Menu</h6>
                <ul>
                    <li>
                        <i><img src="panel.svg" alt="Dashboard" /></i>
                        <a>Dashboard</a>
                    </li>
                    <li>
                        <i><img src="board.svg" alt="Board" /></i>
                        <a>Tableros</a>
                    </li>
                    <li>
                        <i><img src="gestor.svg" alt="Gestor" /></i>
                        <a>Gestor</a>
                    </li>
                    <li class="nav-selected">
                        <i><img src="calendar.svg" alt="Calendar" /></i>
                        <a>Calendario</a>
                    </li>
                    <li>
                        <i><img src="conf.svg" alt="Conf" /></i>
                        <a>Ajustes</a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="main-cont">
            <div class="main-sub-cont" id="mainSubCont">
                <header>
                    <h1 id="main-little-title">Ant Planner / Calendar</h1>
                    <h1 id="main-title">Calendar</h1>
                    <hr>
                </header>
                <main>
                    <div class="calendar-container">
                        <div class="calendar-header">
                            <h2 id="currentMonth"></h2>
                            <div class="calendar-controls">
                                <span id="dateRange"></span>
                                <button id="todayBtn">Hoy</button>
                                <div class="navigation">
                                    <button id="prevWeek">&lt;</button>
                                    <button id="nextWeek">&gt;</button>
                                </div>
                            </div>
                        </div>
                        <div class="calendar-scroll">
                            <div class="calendar-grid">
                                <div class="time-column" id="timeColumn"></div>
                                <div class="days-container" id="daysContainer">
                        
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <script src="calendar.js"></script>
    </body>
</html>
